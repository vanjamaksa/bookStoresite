<!DOCTYPE html>
<html lang="en">
    <head> 
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Browse and buy books online. Discover a wide selection of novels, educational books and bestsellers.">
        <meta name="keywords" content="books, bookstore, buy books, novels, online shop">
        <meta name="author" content="Vanja Maksimovic">
        <title>BookStore | Buy books online</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="assets/img/titelIcon.png" />
        <link href="assets/css/aos.css" rel="stylesheet">
        <!-- Font Awesome icons (free version)-->
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <!-- Google fonts-->
        <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css" />
        <link href="https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700" rel="stylesheet" type="text/css" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="assets/css/styles.css" rel="stylesheet" />
    </head>
    <body id="page-top" data-page="books">
        <!-- Navigation-->
        <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
            <div class="container">
                <a class="navbar-brand" href="index.html"><img src="assets/img/logos/myLogo.png" alt="..." /></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                    Menu
                    <i class="fas fa-bars ms-1"></i>
                </button>
                <div class="collapse navbar-collapse" id="navbarResponsive">
                    <ul class="navbar-nav text-uppercase ms-auto py-4 py-lg-0">
                        <!--printing from main.js-->
                    </ul>
                </div>
            </div>
        </nav>
        <!--Store start-->
        <section class="page-section backgroundPicture" id="books">
  <div class="container">
    <div class="text-center mb-5">
      <h2 class="section-heading text-uppercase text-white">Books</h2>
      <h3 class="section-subheading text-white">
        Discover books from different genres and find titles that match your interests.
      </h3>
    </div>

    <div class="row">
      
      <div class="col-lg-3 mb-4">
        <div class="filter-box">
              <h5 class="filter-title">Filter</h5>

            <div class="mb-4 filter-select">
                <!--printing from main.js-->    
            </div>
            <div class="mb-4 filter-checked">
              <!--printing from main.js-->  
              
            </div>
             <div class="mb-4 mt-2">
                <div class="d-grid mt-1">
                  <button id="applyFilters" class="btn btn-primary">
                      Apply Filters
                  </button>
                </div>
              <div class="d-grid mt-1">
                <button id="resetFilters" class="btn btn-outline-secondary ">
                    Reset Filters
                </button>
              </div>
             </div>
        </div>
      </div>
    
      <div class="col-lg-9">
        <div class="products-topbar mb-4">
          <div class="row g-3">
            <div class="col-md-6">
              <input type="text" id="searchInput" class="form-control" placeholder="Search by title or author...">
            </div>

            <div class="col-md-6">
              <select id="sortSelect" class="form-select">
                <option value="0">Sort by</option>
                <option value="priceAsc">Price: Low to High</option>
                <option value="priceDesc">Price: High to Low</option>
                <option value="titleAsc">Title: A-Z</option>
                <option value="titleDesc">Title: Z-A</option>
                <option value="rating">Rating</option>
              </select>
            </div>
           
          </div>
        </div>

        <div class="row g-4" id="booksContainer">
          <!-- ovde ide ispis knjiga iz JS -->
        </div>
        <div class="row mt-3">
            <div class="col-12">
                <nav>
                    <ul class="pagination justify-content-center mb-0" id="pagination"></ul>
                </nav>
            </div>
          </div>
      </div>

    </div>
  </div>
  <div class="modal fade" id="bookModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content book-modal-content">
        <div class="modal-header border-0">
          <h5 class="modal-title">Book details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="bookModalBody">
          
        </div>
      </div>
    </div>
  </div>
</section>
    <!--Footer-->
        <footer class="footer py-4">
                <div class="container">
                    <div class="row align-items-center">
                        <div class="col-lg-4 text-lg-start">Copyright &copy; BookStore 2026</div>
                        <div class="col-lg-4 my-3 my-lg-0">
                            <a class="btn btn-dark btn-social mx-2" href="https://www.facebook.com/?locale=sr_RS" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                            <a class="btn btn-dark btn-social mx-2" href="https://www.facebook.com/?locale=sr_RS" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                            <a class="btn btn-dark btn-social mx-2" href="https://www.linkedin.com/" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                        </div>
                        <div class="col-lg-4 text-lg-end">
                            <a href="tel:+00 1234 567" class="link-dark text-decoration-none me-3"><span class="fa fa-phone mr-1"></span> +00 1234 567</a> 
							              <a href="mailto:info@bookstore.com" class="link-dark text-decoration-none"></span class="fa fa-paper-plane mr-1">info@bookstore.com</a>
                        </div>
                    </div>
                </div>
            </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <!-- Core theme JS-->
        <script src="assets/js/scripts.js"></script>
        <!--MY JS-->
        <script src="assets/js/main.js"></script>
        <!--Animation JS-->
        <script src="assets/js/aos.js"></script>
        <script>
            AOS.init();
        </script>
        
    </body>
</html>
