        <meta name="keywords" content="books, bookstore, buy books, novels, online shop">
        <meta name="author" content="Vanja Maksimovic">
        <title>BookStore | Finish order</title>

        <link rel="icon" type="image/x-icon" href="assets/img/titelIcon.png" />
        <link href="assets/css/aos.css" rel="stylesheet">
        <!-- Font Awesome icons (free version)-->
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <!-- Google fonts-->
        <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css" />
        <link href="https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700" rel="stylesheet" type="text/css" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="assets/css/styles.css" rel="stylesheet" />
    </head>
    <body id="page-top" data-page="contact">
        <!-- Navigation-->
        <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
            <div class="container">
                <a class="navbar-brand" href="index.html"><img src="assets/img/logos/myLogo.png" alt="..." /></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                    Menu
                    <i class="fas fa-bars ms-1"></i>
                </button>
                <div class="collapse navbar-collapse" id="navbarResponsive">
                    <ul class="navbar-nav text-uppercase ms-auto py-4 py-lg-0">
                        <!--printing from main.js-->
                    </ul>
                </div>
            </div>
        </nav>
        
        <!-- COntact-->
        <section class="page-section backgroundPicture" id="contact">
                
            <div class="container py-5">
                <div class="row justify-content-center">
                    <div class="col-lg-8">
                        <div class="card shadow border-0 rounded-4">
                            <div class="card-header text-white rounded-top-4" style="background-color: #8b000d;">
                                <h2 class="mb-0 text-center">Complete Your Order</h2>
                            </div>

                            <div class="card-body p-4">
                                <form id="checkoutForm">

                                    <div class="mb-3">
                                        <label for="fullName" class="form-label">Full Name</label>
                                        <input type="text" class="form-control" id="fullName" placeholder="Enter your full name">
                                        <small class="text-danger" id="fullNameError"></small>
                                    </div>

                                    <div class="mb-3">
                                        <label for="email" class="form-label">Email Address</label>
                                        <input type="email" class="form-control" id="email" placeholder="Enter your email">
                                        <small class="text-danger" id="emailError"></small>
                                    </div>

                                    <div class="mb-3">
                                        <label for="phone" class="form-label">Phone Number</label>
                                        <input type="tel" class="form-control" id="phone" placeholder="Enter your phone number">
                                        <small class="text-danger" id="phoneError"></small>
                                    </div>

                                    <div class="mb-3">
                                        <label for="address" class="form-label">Address</label>
                                        <input type="text" class="form-control" id="address" placeholder="Street and number">
                                        <small class="text-danger" id="addressError"></small>
                                    </div>

                                    <div class="mb-3">
                                        <label for="city" class="form-label">City</label>
                                        <select class="form-select" id="city">
                                            <option value="0">Choose city</option>
                                            <option value="Belgrade">Belgrade</option>
                                            <option value="Nis">Nis</option>
                                            <option value="Novi Sad">Novi Sad</option>
                                            <option value="Bor">Bor</option>
                                        </select>
                                        <small class="text-danger" id="cityError"></small>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label d-block">Payment Method</label>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="payment" id="cash" value="Cash on Delivery">
                                            <label class="form-check-label" for="cash">Cash on Delivery</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="payment" id="card" value="Card">
                                            <label class="form-check-label" for="card">Card</label>
                                        </div>
                                        <br>
                                        <small class="text-danger" id="paymentError"></small>
                                    </div>

                                    <div class="mb-3">
                                        <label for="note" class="form-label">Additional Note</label>
                                        <textarea class="form-control" id="note" rows="4" placeholder="Optional note"></textarea>
                                        <small class="text-danger" id="noteError"></small>
                                    </div>

                                    <div class="mb-3 form-check">
                                        <input type="checkbox" class="form-check-input" id="terms">
                                        <label class="form-check-label" for="terms">I agree with the terms and conditions</label>
                                        <br>
                                        <small class="text-danger" id="termsError"></small>
                                    </div>

                                    <button type="submit" class="btn text-white w-100" style="background-color: #8b000d;">
                                        Finish Purchase
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    <!--Footer-->
        <footer class="footer py-4">
                <div class="container">
                    <div class="row align-items-center">
                        <div class="col-lg-4 text-lg-start">Copyright &copy; BookStore 2026</div>

                            <a class="btn btn-dark btn-social mx-2" href="https://www.facebook.com/?locale=sr_RS" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                            <a class="btn btn-dark btn-social mx-2" href="https://www.linkedin.com/" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                        </div>
                        <div class="col-lg-4 text-lg-end">

							<a href="mailto:info@bookstore.com" class="link-dark text-decoration-none"></span class="fa fa-paper-plane mr-1">info@bookstore.com</a>
                        </div>
                    </div>
                </div>
            </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Core theme JS-->
